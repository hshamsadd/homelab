- name: Test Playbook
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Wait for VM to be reachable on Port 22
      wait_for_connection:
        delay: 5
        timeout: 300

    - name: Verify SSH is responsive (optional extra check)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
      delegate_to: localhost # <--- This makes the Runner check the port, not the VM itself

    - name: Install a small package (Proof of Sudo)
      apt:
        name: htop
        state: present
        update_cache: yes

    - name: Create a test file with root ownership
      file:
        path: /root/ci_cd_success.txt
        state: touch
        owner: root
        group: root
