- name: Configure K3s worker
  hosts: k3s_workers
  become: true
  gather_facts: true

  roles:
    - common
    - tailscale
    - k3s_agent

  post_tasks:
    - name: Get Tailscale IPv4 address for deployment summary
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: tailscale_summary_ip
      changed_when: false

    - name: Show configured node information
      ansible.builtin.debug:
        msg: |-
          {{ k3s_node_name }} joined Kubernetes through Tailscale address {{ tailscale_summary_ip.stdout | trim }}.

          Connect using Tailscale MagicDNS:
          vault-ssh --user {{ ansible_user }} {{ k3s_node_name }}

          Connect using its Tailscale IP:
          vault-ssh --user {{ ansible_user }} {{ tailscale_summary_ip.stdout | trim }}
