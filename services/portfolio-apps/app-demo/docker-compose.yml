version: "3.9" # specify Compose file version
services:
  # -----------------------
  # Backend
  # -----------------------
  backend:
    build: ./server # path to backend Dockerfile
    container_name: backend
    restart: always
    env_file:
      - ./server/.env # environment variables for backend
    ports:
      - "5000:5000" # map host:container port

  # -----------------------
  # Frontend
  # -----------------------
  frontend:
    build: ./client # path to frontend Dockerfile
    container_name: frontend
    restart: always
    env_file:
      - ./client/.env # optional: frontend env variables
    ports:
      - "5173:5173" # map host:container port
    depends_on:
      - backend # ensure backend starts before frontend

  # -----------------------
  # MongoDB Database
  # -----------------------
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017" # host:container port
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db # persist database

# -----------------------
# Volumes
# -----------------------
volumes:
  mongo-data:

# 🔑 Key Points
#
# MongoDB
#
# Runs as a separate container.
#
# MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD are used to create the admin user.
#
# Volume mongo-data ensures your data persists if the container restarts.
#
# Backend
#
# Builds from ./server directory.
#
# Uses environment variables from .env.
#
# Depends on MongoDB to start first.
#
# Frontend
#
# Builds from ./client directory.
#
# Maps host port 5173 to container port 5173.
#
# Depends on backend to start first.
#
# Volumes
#
# mongo-data keeps database files persistent across restarts.
#
# ⚡ How to run
# # Build images and start all containers
# docker-compose up --build
#
# # Or run in detached mode (background)
# docker-compose up --build -d
#
# # Stop and remove all containers, networks, volumes
# docker-compose down
#
# # View logs for all containers
# docker-compose logs
#
# # View logs for a specific service
# docker-compose logs backend
