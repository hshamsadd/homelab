name: Azure Bicep CI/CD

on:
  push:
    branches: [ "main" ]
    paths: [ 'bicep/**' ]
  pull_request:
    branches: [ "main" ]
    paths: [ 'bicep/**' ]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint Bicep Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bicep Build
        run: az bicep build --file bicep/main.bicep

  plan:
    name: Azure What-If (Plan)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Run What-If
        run: |
          az deployment sub what-if \
            --name "gha-plan-${{ github.run_id }}" \
            --location germanywestcentral \
            --template-file bicep/main.bicep

  apply:
    name: Azure Deployment (Apply)
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          
      - name: Run Deployment
        run: |
          az deployment sub create \
            --name "gha-deploy-${{ github.run_id }}" \
            --location germanywestcentral \
            --template-file bicep/main.bicep