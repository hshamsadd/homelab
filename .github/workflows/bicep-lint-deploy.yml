name: Azure Bicep CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'bicep/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'bicep/**'

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-plan:
    name: OIDC Azure Authentication & Bicep Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure via Entra ID OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Lint Bicep Templates
        run: |
          echo "Compiling Bicep templates to ARM..."
          az bicep build --file bicep/main.bicep
          
      # In a live enterprise environment, the next step would be OIDC Authentication 
      # to Entra ID (Azure AD) followed by an 'az deployment sub what-if' command.
      # We skip actual deployment here to prevent cloud costs.