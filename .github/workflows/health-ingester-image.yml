name: Health Ingester - Build Image

on:
  pull_request:
    paths:
      - apps/health-ingester/**
      - .github/workflows/health-ingester-image.yml
  push:
    branches:
      - main
    paths:
      - apps/health-ingester/**
      - .github/workflows/health-ingester-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: health-ingester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/health-ingester/go.mod
          cache: false

      - name: Test
        working-directory: apps/health-ingester
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/health-ingester
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/health-ingester
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Report immutable image
        if: github.event_name != 'pull_request'
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/health-ingester"
          echo "Digest: ${{ steps.build.outputs.digest }}"
