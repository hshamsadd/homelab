# Name of the workflow
name: build-and-lint

# Define when this workflow should run
on:
  push:
    # Trigger on push to these branches
    branches:
      - main
      - dev
  pull_request:
    # Trigger on pull requests targeting these branches
    branches:
      - main
      - dev

# Define jobs for this workflow
jobs:
  build-and-lint:
    # Run the job on the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Steps are executed sequentially
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: Setup Node.js environment
      - name: Setup Node
        uses: actions/setup-node@v3 # Corrected action for Node
        with:
          node-version: 20 # Use Node.js v20

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        working-directory: server # Move into server folder
        run: npm ci # CI-friendly clean install

      # Step 4: Run ESLint to check code quality
      - name: Lint backend
        working-directory: server
        run: npm run lint -- --max-warnings=0 # Fail workflow if any lint warnings


# =========================
# Workflow Name
# =========================
name: Backend CI

# =========================
# Triggers
# =========================
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# =========================
# Jobs
# =========================
jobs:
  build-lint-test:
    name: Build, Lint & Test Backend
    runs-on: ubuntu-latest

    # =========================
    # Steps
    # =========================
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'              # caches node_modules for speed

      # 3️⃣ Install dependencies
      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci                 # CI-friendly install, clean slate

      # 4️⃣ Lint code
      - name: Lint Backend
        working-directory: server
        run: npm run lint -- --max-warnings=0
        # Fail workflow if any lint warnings (enforces strict quality)

      # 5️⃣ Run tests
      - name: Run Tests
        working-directory: server
        run: npm test               # run Jest or any testing framework


✅ Senior-Level Best Practices Shown Here

Branch triggers

Only main/dev branches → avoids unnecessary CI runs.

Pull request triggers → ensures code is validated before merging.

Node Setup

Use actions/setup-node@v3.

Use cache to speed up repeated builds (npm cache).

Clean dependency installation

npm ci instead of npm install → ensures reproducible builds.

Linting

Fail CI if any warnings → keeps code quality high.

Ensures ESLint config is followed automatically.

Testing

Always run automated tests in CI.

Optionally, you can add coverage reporting in the future.

Separation of concerns

working-directory: server → keeps frontend/backend separated if monorepo.

Readable & maintainable YAML

Indentation, sections, and comments.

Easy for new team members to understand workflow quickly.

💡 Optional Senior Enhancements

Security checks: run npm audit --audit-level=high

Build Docker image: if your backend runs in Docker

Deployment step: push to staging or production if tests pass

Matrix builds: run on multiple Node versions for compatibility

