name: Terraform + Ansible CI/CD

on:
  push:
    branches: [back-up-1]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️⃣ Connect to Tailscale (Puts the Runner on your 100.x.x.x network)
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      # 2️⃣ Create the Key File (CRITICAL: This is the file Terraform, and Ansible use)
      - name: Setup SSH
        run: |
          mkdir -p /home/runner/.ssh
          # Write the secret to the NEW filename you chose
          echo "${{ secrets.LIBVIRT_SSH_KEY }}" | base64 -d > /home/runner/.ssh/id_ed25519_github_actions

          # Set correct permissions (SSH will reject the key otherwise)
          chmod 600 /home/runner/.ssh/id_ed25519_github_actions

          # Verification check - if this says 0 or fails, the secret is empty/wrong
          ls -l /home/runner/.ssh/id_ed25519_github_actions

          # Add the host to known_hosts to prevent the "Are you sure you want to connect" prompt
          ssh-keyscan -H 100.92.179.76 >> /home/runner/.ssh/known_hosts

      # 3️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # 4️⃣ Terraform Apply
      # It will use /home/runner/.ssh/id_ed25519_github_actions to talk to the host
      # AND it will read that same file to verify the VM via remote-exec.
      - name: Terraform Init & Apply
        working-directory: terraform
        env:
          # This tells Terraform: "Use the Runner path for the variable"
          TF_VAR_ssh_private_key_path: "/home/runner/.ssh/id_ed25519_github_actions"
        run: |
          terraform init
          terraform apply -auto-approve

      # 5️⃣ Run Ansible Playbook
      # It reads ansible/inventory.json which points to the key we made in Step 2.
      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i ansible/inventory.json ansible/playbooks/site.yml
