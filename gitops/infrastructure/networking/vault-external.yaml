apiVersion: v1
kind: Service
metadata:
  name: vault-external
  namespace: infrastructure
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: vault-backend@kubernetescrd
spec:
  ports:
    - name: https
      protocol: TCP
      port: 8200
      targetPort: 8200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-external
  namespace: infrastructure
  labels:
    kubernetes.io/service-name: vault-external
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8200
endpoints:
  - addresses:
      - 100.96.242.26
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vault-backend
  namespace: infrastructure
spec:
  serverName: debian.tailfb03f6.ts.net
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-external
  namespace: infrastructure
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vault.home`)
      kind: Rule
      services:
        - name: vault-external
          port: 8200
          scheme: https
          serversTransport: vault-backend
