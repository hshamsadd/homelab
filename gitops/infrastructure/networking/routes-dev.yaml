apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-ingester-route
  namespace: dev
spec:
  parentRefs:
    - name: local-cluster-gateway
      namespace: kube-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/health-connect
      backendRefs:
        - name: health-ingester
          port: 8080
