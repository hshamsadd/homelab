apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-dev-route
  namespace: dev
spec:
  parentRefs:
    - name: local-cluster-gateway
      namespace: kube-system
  hostnames: [ "minio-dev.home" ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      backendRefs: [ { name: minio-console-ingress, port: 9001 } ]
---
