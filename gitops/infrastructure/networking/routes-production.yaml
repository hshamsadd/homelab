apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-prod-route
  namespace: production
spec:
  parentRefs:
    - name: local-cluster-gateway
      namespace: infrastructure
  hostnames: [ "minio.home" ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      backendRefs: [ { name: minio, port: 9001 } ]
---
