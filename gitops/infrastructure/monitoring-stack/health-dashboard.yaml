              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "\nSELECT\n  to_char(\n    session_start_time AT TIME ZONE 'Europe/Amsterdam',\n    'YYYY-MM-DD HH24:MI'\n  ) AS \"Start\",\n  to_char(\n    session_end_time AT TIME ZONE 'Europe/Amsterdam',\n    'YYYY-MM-DD HH24:MI'\n  ) AS \"End\",\n  round((duration_seconds / 3600.0)::numeric, 2) AS \"Hours\",\n  COALESCE(data #>> '{metadata,data_origin}', '<unknown>') AS \"Source\"\nFROM health.sleep_sessions\nORDER BY session_end_time DESC\nLIMIT 20;\n",
