              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "\nSELECT\n  local_date AS \"Date\",\n  initcap(replace(data_type, '_', ' ')) AS \"Metric\",\n  round(value::numeric, 2) AS \"Value\",\n  unit AS \"Unit\",\n  to_char(\n    observed_through AT TIME ZONE 'Europe/Amsterdam',\n    'YYYY-MM-DD HH24:MI'\n  ) AS \"Observed through\"\nFROM health.activity_daily\nORDER BY local_date DESC, data_type;\n",
              "refId": "A"
            }
          ]
        },
