          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "health-postgres-dev"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "\nWITH ranked AS (\n  SELECT\n    data_type,\n    observed_at,\n    value,\n    unit,\n    COALESCE(data #>> '{metadata,data_origin}', '<unknown>') AS source,\n    ROW_NUMBER() OVER (\n      PARTITION BY data_type\n      ORDER BY observed_at DESC, id DESC\n    ) AS rn\n  FROM health.measurements\n)\nSELECT\n  initcap(replace(data_type, '_', ' ')) AS \"Metric\",\n  to_char(\n    observed_at AT TIME ZONE 'Europe/Amsterdam',\n    'YYYY-MM-DD HH24:MI'\n  ) AS \"Observed\",\n  round(value::numeric, 2) AS \"Value\",\n  unit AS \"Unit\",\n  source AS \"Source\"\nFROM ranked\nWHERE rn = 1\nORDER BY data_type;\n",
              "refId": "A"
            }
          ]
        },
