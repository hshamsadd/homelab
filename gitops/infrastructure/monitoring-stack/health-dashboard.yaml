              "rawSql": "\nSELECT\n  initcap(replace(data_type, '_', ' ')) AS \"Record Type\",\n  record_count AS \"Records\",\n  to_char(\n    first_recorded_at AT TIME ZONE 'Europe/Amsterdam',\n    'YYYY-MM-DD HH24:MI'\n  ) AS \"First\",\n  to_char(\n    last_recorded_at AT TIME ZONE 'Europe/Amsterdam',\n    'YYYY-MM-DD HH24:MI'\n  ) AS \"Last\"\nFROM health.record_inventory\nORDER BY data_type;\n",
