apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/hshamsadd/hybrid-cloud-gitops.git'
    targetRevision: main
    path: gitops/apps/environments/secrets/dev-secrets
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/hshamsadd/hybrid-cloud-gitops.git'
    targetRevision: main
    path: gitops/apps/environments/secrets/production-secrets
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
