apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hshamsadd/hybrid-cloud-gitops.git'
    targetRevision: main
    path: gitops/apps/environments/production
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
