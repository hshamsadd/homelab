apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: setup-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/hshamsadd/hybrid-cloud-gitops.git'
    targetRevision: main
    path: gitops/apps/environments/cluster-setup/dev-setup
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: setup-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/hshamsadd/hybrid-cloud-gitops.git'
    targetRevision: main
    path: gitops/apps/environments/cluster-setup/production-setup
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
