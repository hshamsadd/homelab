apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hshamsadd/homelab.git'
    targetRevision: main
    path: gitops/apps/environments/staging
    # Explicitly force Kustomize to prevent Helm auto-detection
    plugin:
      name: kustomize
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
