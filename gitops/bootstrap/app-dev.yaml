apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hshamsadd/homelab.git
    targetRevision: main
    path: gitops/apps/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
