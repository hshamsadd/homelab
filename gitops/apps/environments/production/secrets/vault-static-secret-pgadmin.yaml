apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgadmin-credentials-vault
  namespace: production
spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/pgadmin
  vaultAuthRef: production-vault-auth
  refreshAfter: 1m

  destination:
    create: true
    name: pgadmin-credentials-vault
    transformation:
      excludeRaw: true
