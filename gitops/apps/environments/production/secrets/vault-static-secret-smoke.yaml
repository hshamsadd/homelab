apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-smoke-test
  namespace: production
spec:
  type: kv-v2
  mount: kv
  path: kubernetes/production/vso-smoke-test
  vaultAuthRef: production-vault-auth
  refreshAfter: 30s

  destination:
    create: true
    name: vault-smoke-test
