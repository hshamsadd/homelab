apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-postgres-backups
spec:
  configuration:
    destinationPath: s3://postgres-backups/
    endpointURL: http://minio.production.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-production-credentials-vault
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-production-credentials-vault
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 8
    data:
      compression: gzip
  retentionPolicy: "30d"
