apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Automatically forces all resources below into the production namespace
namespace: production

resources:
  # 2. Create the namespace itself
  - namespace.yaml

  # 3. Call in the base apps (fixed paths to match your pristine gitops/apps/base structure)
  - ../../base/cloudnative-pg
  - ../../base/minio
  - ../../base/pgadmin
  - ../../base/redis
  - ../../base/wallabag
  #- ../../base/argocd-ui

  # 4. Call in the production Kubernetes secrets
  - ./secrets

  # 5. Call in and append production-specific objects (Jobs, Backups)
  - ./patches/minio/minio-local-pv.yaml
  - ./patches/cloudnative-pg/central-postgres-ha.yaml
  - ./patches/cloudnative-pg/barman-objectstore.yaml
  - ./patches/cloudnative-pg/manual-backup.yaml
  - ./patches/cloudnative-pg/scheduled-backup.yaml
  - ./patches/cloudnative-pg/scheduled-backup-ha.yaml
  - ./patches/minio/minio-bucket-job.yaml

patches:
  - path: ./patches/cloudnative-pg/central-postgres-retirement-guard.yaml
  - path: ./patches/minio/minio-vault-secret.yaml
  - path: ./patches/wallabag/wallabag-vault-secret.yaml
  - path: ./patches/pgadmin/pgadmin-vault-secret.yaml
