apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production

resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  # 2. Call in the base apps (fixed paths to match your pristine gitops/apps/base structure)
  - ../../base/minio
  - ../../base/pgadmin
  - ../../base/redis
  - ../../base/wallabag
  - ./secrets
  # 3. Call in and append production-specific objects (Jobs, Backups)
  - ./patches/minio/minio-local-pv.yaml
  - ./patches/cloudnative-pg/central-postgres-ha.yaml
  - ./patches/cloudnative-pg/barman-objectstore.yaml
  - ./patches/cloudnative-pg/scheduled-backup-ha.yaml
  - ./patches/cloudnative-pg/oci-postgres-dr-mirror-cronjob.yaml
  - ./patches/minio/minio-bucket-job.yaml

patches:
  - path: ./patches/minio/minio-vault-secret.yaml
  - path: ./patches/wallabag/wallabag-vault-secret.yaml
  - path: ./patches/pgadmin/pgadmin-vault-secret.yaml
