apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: production-postgres-backups
  namespace: staging
spec:
  configuration:
    destinationPath: s3://postgres-backups/
    # Points across namespaces to the production MinIO instance
    endpointURL: http://minio.production.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-production-fallback-vault
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-production-fallback-vault
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
