apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  template:
    spec:
      containers:
        - name: n8n
          env:
            - name: DB_POSTGRESDB_HOST
              value: "central-postgres-dev-rw.dev.svc.cluster.local"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n_dev"
            - name: N8N_HOST
              value: "n8n-dev.home"
