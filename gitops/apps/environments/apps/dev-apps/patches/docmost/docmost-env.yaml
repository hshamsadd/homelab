apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1
      containers:
        - name: docmost
          env:
            - name: APP_URL
              value: "http://docmost-dev.home"
            - name: REDIS_URL
              value: "redis://redis.dev.svc.cluster.local:6379"

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
