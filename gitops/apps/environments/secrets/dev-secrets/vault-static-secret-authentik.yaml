apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-credentials-vault
  namespace: dev
spec:
  type: kv-v2
  mount: kv
  path: kubernetes/dev/authentik
  vaultAuthRef: dev-vault-auth
  refreshAfter: 1m
  destination:
    create: true
    name: authentik-credentials-vault
  rolloutRestartTargets:
    - kind: Deployment
      name: authentik-server
    - kind: Deployment
      name: authentik-worker
