apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: dev-vault-auth
  namespace: dev
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes

  kubernetes:
    role: kubernetes-dev
    serviceAccount: vault-secrets
    audiences:
      - vault
    tokenExpirationSeconds: 600
