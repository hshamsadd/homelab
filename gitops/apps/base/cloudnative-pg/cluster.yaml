apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: central-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"
      
#  rawResources:
#    limits:
#      cpu: "500m"
#      memory: "512Mi"
#    requests:
#      cpu: "100m"
#      memory: "128Mi"    

  storage:
    size: 15Gi
    storageClass: local-path

  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      kubernetes.io/hostname: worker-1

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-postgres-backups
