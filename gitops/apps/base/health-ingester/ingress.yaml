apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-ingester-route
  namespace: dev
spec:
  parentRefs:
    - name: local-cluster-gateway
      namespace: kube-system
    # 💡 Hostnames field is intentionally left blank to act as a catch-all (*), matching your original spec.
  rules:
    - matches:
        - path:
            type: Exact # 🚨 Matches your original 'Exact' pathType
            value: /v1/health-connect
      backendRefs:
        - name: health-ingester
          port: 8080 # 🚨 Matches your original named port mapping
