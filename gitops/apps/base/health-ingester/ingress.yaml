apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-ingester
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /v1/health-connect
            pathType: Exact
            backend:
              service:
                name: health-ingester
                port:
                  name: http
