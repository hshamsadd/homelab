apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost
  labels:
    app.kubernetes.io/name: docmost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docmost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docmost
    spec:
      containers:
        - name: docmost
          image: docmost/docmost:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_URL
              value: "http://docmost-dev.home"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: docmost-credentials-vault
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docmost-credentials-vault
                  key: DATABASE_PASSWORD
            - name: REDIS_URL
              value: "redis://redis.dev.svc.cluster.local:6379"
